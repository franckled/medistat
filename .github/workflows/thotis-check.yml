name: THOTIS - verification

on:
  push:
    branches:
      - feat/thotis-source-import
  pull_request:
    branches:
      - feat/thotis-source-import
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Dependencies, TypeScript and Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Yarn 1.22.22
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: TypeScript check
        run: yarn typecheck

      - name: Expo Doctor
        run: yarn doctor
