name: THOTIS - update Expo dependencies

on:
  push:
    branches:
      - feat/thotis-source-import
    paths:
      - ".github/workflows/thotis-update-expo.yml"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update Expo SDK patch versions and lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout THOTIS branch
        uses: actions/checkout@v4
        with:
          ref: feat/thotis-source-import

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Yarn 1.22.22
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Update Expo packages and regenerate yarn.lock
        run: |
          yarn add --ignore-scripts @expo/metro-runtime@57.0.17 expo@57.0.31 expo-constants@57.0.22 expo-linking@57.0.13 expo-router@57.0.29 expo-sharing@57.0.24 expo-splash-screen@57.0.10

      - name: Check TypeScript
        run: yarn typecheck

      - name: Check Expo compatibility
        run: yarn doctor

      - name: Commit dependency updates
        run: |
          if git diff --quiet -- package.json yarn.lock; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock
          git commit -m "Update Expo SDK 57 patch dependencies"
          git push origin HEAD:feat/thotis-source-import
