name: THOTIS - iOS cloud build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/thotis-source-import
    paths:
      - "app.json"
      - "eas.json"
      - ".github/workflows/thotis-ios-build.yml"

permissions:
  contents: read

jobs:
  ios-build:
    name: Build and submit THOTIS for iOS
    runs-on: ubuntu-latest
    steps:
      - name: Check out THOTIS
        uses: actions/checkout@v4
        with:
          ref: feat/thotis-source-import

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Verify linked EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas project:info

      - name: Prepare App Store Connect credentials
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'eas.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          const ios = config.submit?.production?.ios;
          if (!ios) throw new Error('Missing submit.production.ios configuration in eas.json');

          if (ios.ascApiKeyPath && !fs.existsSync(ios.ascApiKeyPath)) {
            console.log('Local App Store Connect API key is not present on this runner; using the key managed by EAS, if configured.');
            delete ios.ascApiKeyPath;
            delete ios.ascApiKeyId;
            delete ios.ascApiKeyIssuerId;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          } else {
            console.log('Using the configured local App Store Connect API key.');
          }
          NODE

      - name: Build iOS production and submit to Apple
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile production --auto-submit --non-interactive
