name: THOTIS - iOS cloud build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/thotis-source-import
    paths:
      - "app.json"
      - "eas.json"
      - ".github/workflows/thotis-ios-build.yml"

permissions:
  contents: read

jobs:
  ios-build:
    name: Build THOTIS for iOS with EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check out THOTIS
        uses: actions/checkout@v4
        with:
          ref: feat/thotis-source-import

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Verify linked EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas project:info

      - name: Build iOS preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile preview --non-interactive
